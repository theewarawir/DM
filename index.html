<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Application</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; font-family: sans-serif; }
        .app-container { position: relative; width: 100%; height: 100%; overflow: hidden; background-color: white; }
        
        /* สไตล์หน้าจอโหลดข้อมูล */
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #6b7280; font-size: 14px; z-index: 0; }
        
        /* ซ่อนแบนเนอร์คอมพิวเตอร์ (ดันขึ้น 46px) */
        .app-container iframe { position: absolute; top: -46px; left: 0; width: 100%; height: calc(100% + 46px); border: none; z-index: 10; }
        
        /* ซ่อนแบนเนอร์มือถือ (ดันขึ้น 58px) */
        @media screen and (max-width: 768px) { 
            .app-container iframe { top: -58px; height: calc(100% + 58px); } 
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="loading">กำลังโหลดระบบ...</div>
        <iframe src="https://script.google.com/macros/s/AKfycbw7JJZvJI4vyuiMU3GJuQCxjXESMKWN-mwMl76kdFNHi26-TBr6IAGJQ_Ok1qQs7EU/exec" allowfullscreen></iframe>
    </div>
</body>
</html>
